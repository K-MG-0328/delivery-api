plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.github.mingyu'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {

    /*공유 이벤트 모듈*/
    implementation project(':common-event')

    /*필수 목록*/
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'com.mysql:mysql-connector-j'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    /*편의성 관련 라이브러리*/
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    /*검증 관련 라이브러리*/
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    /*보안 관련 라이브러리 */
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.6'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    /*성능 관련 라이브러리*/
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    /*API 문서화 관리*/
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6' //Swagger

    /*테스트 관련 라이브러리*/
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    runtimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    /*QueryDSL 라이브러리 (Q-class는 src/main/generated에 체크인되어 사용)*/
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'

    /*kafka*/
    implementation 'org.springframework.kafka:spring-kafka'

    /*실시간 서비스를 위한 웹소켓 라이브러리 추가*/
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    /*AWS 클라우드*/
    implementation platform("io.awspring.cloud:spring-cloud-aws-dependencies:3.0.1")
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-secrets-manager'

    /* shedlock 분산 락 기반 스케줄링*/
    implementation 'net.javacrumbs.shedlock:shedlock-spring:5.13.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-redis-spring:5.13.0'
}

tasks.named('test') {
	useJUnitPlatform()
}

// QueryDSL Q-class는 src/main/java/.../domain/ 옆에 직접 체크인되어 사용.
// 엔티티 변경 시 별도로 Q-class를 재생성해 커밋한다.